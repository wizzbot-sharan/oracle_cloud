<!doctype html>
<html><body><main id="application-form"><section><h2>Options</h2>
  <label for="country">Country</label><select id="country"><option value="">Select</option><option value="US">United States</option><option value="IN" disabled>India</option></select>
  <label for="long-skill">Long skill list</label><input id="long-skill" role="combobox" aria-controls="long-skill-list"><div id="long-skill-list" role="listbox" hidden style="height:32px;overflow:auto"><div role="option" data-value="one">One</div><div role="option" data-value="two">Two</div><div role="option" data-value="three">Three</div><div role="option" data-value="four">Four</div><div role="option" data-value="five">Five</div></div>
  <div id="unrelated-list" role="listbox" style="height:32px;overflow:auto"><div role="option" data-value="wrong">Wrong overlay option</div></div>
  <label for="lazy-skill">Lazy skill list</label><input id="lazy-skill" role="combobox" aria-controls="lazy-skill-list"><div id="lazy-skill-list" role="listbox" hidden style="height:32px;overflow:auto"><div role="option" data-value="alpha">Alpha</div><div role="option" data-value="beta">Beta</div></div>
  <label for="virtual-skill">Virtual skill list</label><input id="virtual-skill" role="combobox" aria-controls="virtual-skill-list"><div id="virtual-skill-list" role="listbox" hidden style="height:32px;overflow:auto"><div id="virtual-rows" style="position:sticky;top:0;background:white"><div role="option" data-value="one">One</div><div role="option" data-value="two">Two</div></div><div style="height:96px"></div></div>
  <label for="incomplete-skill">Incomplete skill list</label><input id="incomplete-skill" role="combobox" aria-controls="incomplete-skill-list"><div id="incomplete-skill-list" role="listbox" hidden style="height:32px;overflow:auto"><div role="option" data-value="a">A</div><div role="option" data-value="b">B</div><div role="option" data-value="c">C</div><div role="option" data-value="d">D</div><div role="option" data-value="e">E</div><div role="option" data-value="f">F</div><div role="option" data-value="g">G</div><div role="option" data-value="h">H</div></div>
</section></main><script>
for (const id of ['long-skill','lazy-skill','virtual-skill','incomplete-skill']) document.querySelector('#'+id).onclick=()=>document.querySelector('#'+id+'-list').hidden=false;
const lazy=document.querySelector('#lazy-skill-list');lazy.onscroll=()=>{if(lazy.dataset.loaded)return;lazy.dataset.loaded='true';setTimeout(()=>lazy.insertAdjacentHTML('beforeend','<div role="option" data-value="gamma">Gamma</div><div role="option" data-value="delta">Delta</div>'),20)};
const virtual=document.querySelector('#virtual-skill-list'), rows=document.querySelector('#virtual-rows');virtual.onscroll=()=>{rows.innerHTML=virtual.scrollTop>=30?'<div role="option" data-value="three">Three</div><div role="option" data-value="four">Four</div><div role="option" data-value="five">Five</div>':'<div role="option" data-value="one">One</div><div role="option" data-value="two">Two</div>'};
</script></body></html>
