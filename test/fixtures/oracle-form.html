<!doctype html>
<html>
  <body>
    <main id="application-form">
      <section>
        <h2>Contact Information</h2>
        <label for="first-name">First Name <span aria-hidden="true">*</span></label>
        <input id="first-name" name="firstName" required placeholder="Legal first name" maxlength="80">
        <label for="contact-comments">Comments</label>
        <textarea id="contact-comments" name="contactComments"></textarea>
        <input type="hidden" name="internalToken" value="secret">
      </section>

      <section>
        <h2>Application Questions</h2>
        <fieldset>
          <legend>Are you authorized to work?</legend>
          <label><input type="radio" name="authorized" value="yes" required> Yes</label>
          <label><input type="radio" name="authorized" value="no"> No</label>
        </fieldset>
        <fieldset>
          <legend>Available shifts</legend>
          <label><input type="checkbox" name="shift" value="am"> AM</label>
          <label><input type="checkbox" name="shift" value="pm"> PM</label>
        </fieldset>
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Select</option>
          <option value="US">United States</option>
          <option value="IN">India</option>
        </select>
        <label for="skills">Primary skill</label>
        <input id="skills" role="combobox" aria-controls="skill-options" aria-expanded="false">
        <div id="skill-options" role="listbox" hidden>
          <div role="option" data-value="js">JavaScript</div>
          <div role="option" data-value="sql">SQL</div>
        </div>
        <label for="question-comments">Comments</label>
        <textarea id="question-comments" name="questionComments"></textarea>
      </section>

      <label for="orphan">Portfolio URL</label>
      <input id="orphan" type="url" name="portfolio">
      <button type="button" data-bind="addEducation">Add Education</button>
      <button type="submit">Submit</button>
    </main>
  </body>
</html>
